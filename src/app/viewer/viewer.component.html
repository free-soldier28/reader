<div class="header">
    <button type="button" mat-icon-button class="back-btn" (click)="goHome()">
        <mat-icon>arrow_back</mat-icon>
    </button>
    <span class="document-name">{{ document()?.name }}</span>

    <app-annotation-toolbar
        [selectedTool]="currentAnnotationTool"
        (toolSelected)="setAnnotationTool($event)">
    </app-annotation-toolbar>

    <app-zoom [disabled]="!document()?.pages?.length" (increased)="zoomIncreased()" (decreased)="zoomDecreased()"></app-zoom>

    <button mat-icon-button class="save-btn" (click)="save()">
        <mat-icon>save</mat-icon>
    </button>
</div>

<div class="content">
    <app-document
        [pages]="document()?.pages"
        [pagesMarginTop]="pagesMarginTop()"
        [scaleFactor]="scaleFactor()"
        (pageClicked)="clickByPage($event)"
        (annotationMouseUp)="onMouseUp($event)">
    </app-document>
</div>

<app-text-editor
    [show]="isShowTextEditor()"
    [position]="textEditorPosition()"
    (textAdded)="addTextAnnotation($event)">
</app-text-editor>

<input #fileInput class="file-uploader" type="file" id="fileInput" [accept]="availableImageExtensions" (change)="fileSelected($event)">
